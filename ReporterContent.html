<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankFileMedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script>
    /*$(function(){
      $("header").load("Header.html"); 
    });*/
    $(function(){
      $.get("Header.html", function(data) {
        $("header").replaceWith(data);
      });
    });
  </script>
</head>
<body class="font-sans bg-white text-gray-900">
  <header></header>
  <div class="main-content container mx-auto py-8 px-4 flex position-fixed">
    <div class="flex flex-col w-full md:w-3/4 mx-4 pl-8">
        <h1 class="mb-9 text-left text-3xl font-bold"> Manage Content </h1>
        <div class="options">
          <button class="border-2 border-solid mx-3 px-3" id="show-articles">My Articles</button>
          <button class="border-2 border-solid mx-3 px-3" id="show-polls-chats">Polls/Chats</button>
        </div>
        <div class="pt-10" id="articles-content" class="content hidden">
          <a href="/NewArticle.html" class="inline-block border-2 border-solid mx-3 px-3 py-2 rounded-lg border-gray-200 dark:bg-gray-900 text-white text-center" id="create-article">New Article</a>
          <!-- Articles content goes here -->
          <p>Your Articles</p>
        </div>
        <div id="polls-chats-content" class="content hidden">
          <!-- Polls and Chats content goes here -->
          <p>Polls and Chats content...</p>
        </div>
    </div>
  </div>
  <script src="./ReporterContent.js"></script>
</body>
</html>

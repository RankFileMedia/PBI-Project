<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RankFileMedia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script>
    /*$(function(){
      $("header").load("Header.html"); 
    });*/
    $(function(){
      $.get("Header.html", function(data) {
        $("header").replaceWith(data);
      });
    });
  </script>
</head>

<body class="font-sans bg-white text-gray-900">
  <header></header>
  <div class="p-10">
    <button id="submitArticle" class="border-2 border-solid mx-3 px-3 py-2 rounded-lg border-gray-200 dark:bg-gray-900 text-white text-center">Submit All</button> 
    <input type="text" id="articleTitle" name="title" class="w-full p-2 m-2 bg-gray-100 rounded-lg" placeholder="Article Title" maxlength="150">
    <textarea class="w-full p-2 m-2" id="articleText" name="article" rows="10" cols="50" style="height: 300px;" placeholder="Write your article here..."></textarea>
    <div>
      <div id="dropZone" class="drop-zone border-2 border-solid mx-3 px-3 py-2 rounded-lg border-gray-200 dark:bg-gray-500 text-white text-center">
        Drag and drop files here or click to select files.
      </div>
      <ul id="fileList"></ul>
    </div>
  </div>
  
  <script src="/NewArticle.js"></script>
</body>
</html>
